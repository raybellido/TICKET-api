spring.application.name=helpdesk
spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk
spring.datasource.username=root
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


app.jwt.secret=${APP_JWT_SECRET:dev-secret-cambiar-en-produccion-0123456789}
app.jwt.expiration=1h
app.jwt.issuer=helpdesk


# Orígenes exactos permitidos.
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
# Permite cualquier puerto de localhost/127.0.0.1 (y no "localhost:*", que como
# regex significa "localhos" con cero o mas "t"). Evita que cambiar el puerto de
# Vite rompa el frontend en desarrollo. Quitar en produccion.
app.cors.allowed-origin-patterns=http://localhost:[*],http://127.0.0.1:[*]
app.cors.allow-credentials=true

app.bootstrap-admin.enabled=true
app.bootstrap-admin.name=Admin
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@helpdesk.com}
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}
